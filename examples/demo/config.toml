# The demo config: every input is a synthetic file in this folder, and the
# clock is fixed, so `python3 src/fleet_view.py --demo` prints the same text on
# every machine (examples/expected-output.txt). Nothing here is real.

# The demo's "now". Leave it out in a real config: the view uses the real time.
clock = "2026-01-15T17:30:00+00:00"

[fleet]
snapshot_file = "snapshot.json"   # a saved `herdr api snapshot` instead of asking Herdr
top_programs = 3

[[machines]]
name = "local"
file = "machines/local.json"      # a saved reading instead of reading /proc

[[machines]]
name = "build-box"
file = "machines/build-box.json"

[[machines]]
name = "gpu-box"
file = "machines/gpu-box.json"    # a probe that failed: "Connection timed out"

[spend]
logs = ["logs"]                   # synthetic Claude Code transcripts
day_start = "00:00"
big_context = 200000
rebuild_share = 0.30

[prices.fable]
input = 8.0
output = 40.0
cache_read = 0.20
cache_write_5m = 10.0
cache_write_1h = 16.0

[prices.opus]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write_5m = 5.0
cache_write_1h = 8.0

[prices.sonnet]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write_5m = 2.5
cache_write_1h = 4.0

[prices.haiku]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20
