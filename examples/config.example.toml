# Fleet view settings. Copy this file to
#   ~/.config/playbook-herdr-fleet-view/config.toml
# and change it. The code holds no host names and no paths: they all come
# from here. A path may start with ~ ; a relative path is read from the
# folder of this file.

[fleet]
herdr = "herdr"        # the Herdr command; the view runs `herdr api snapshot`
interval = 10          # seconds between redraws of the fleet pane
top_programs = 3       # programs by RAM shown under each machine

# One [[machines]] table per machine. With no "ssh" key it is the machine the
# view runs on, read from /proc.
[[machines]]
name = "local"

# A machine you reach with ssh. The alias comes from your ~/.ssh/config, the
# login must work with no password prompt (a key), and the machine needs
# python3 (3.9 or newer). Nothing is installed there: the probe goes over
# ssh on stdin each time.
# [[machines]]
# name = "build-box"
# ssh = "build-box"

[spend]
logs = ["~/.claude/projects"]   # Claude Code writes one transcript per session here
day_start = "00:00"             # "today" starts here, in this machine's time zone
interval = 60                   # seconds between redraws of the token pane
big_context = 200000            # a live agent whose last call read more gets a lever
rebuild_share = 0.30            # cache writes above this share of the tokens read get a lever

# USD per million tokens, matched against the model name: the longest key
# that appears in it wins. These are the API list prices of the current
# models when this was written (2026-11): check the provider's price page.
# A key covers every model whose name holds it, older ones too: "haiku"
# alone would price claude-haiku-4-5 at Haiku 5.5's price, so it has its own
# key below. A version key covers its point releases as well: "opus-5" also
# matches claude-opus-5-5, so give a point release with another price its
# own, longer key ("opus-5-5"). A model with no key is named under the token
# pane, with how many of its calls were not counted.
[prices.fable]
input = 8.0
output = 40.0
cache_read = 0.20
cache_write_5m = 10.0
cache_write_1h = 16.0

[prices.opus]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write_5m = 5.0
cache_write_1h = 8.0

[prices.sonnet]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write_5m = 2.5
cache_write_1h = 4.0

[prices.haiku]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20

[prices."haiku-4-5"]
input = 1.0
output = 5.0
cache_read = 0.10
cache_write_5m = 1.25
cache_write_1h = 2.0
